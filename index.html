<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>庫存清點紀錄</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f6f7f9;--card:#fff;--text:#171717;--muted:#747474;--line:#e6e7ea;
      --primary:#1f6feb;--danger:#d1242f;--soft:#eef4ff;--shadow:0 8px 26px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(180deg,#f8fafc 0,#f4f6f8 180px);color:var(--text);-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:760px;margin:auto;padding:18px 14px 96px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{font-size:25px;letter-spacing:-.4px;margin:0 0 5px}
    .sub{font-size:13px;color:var(--muted)}
    

    .top > div:first-child{min-width:0;flex:1}
    .top-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex:0 0 auto;flex-wrap:nowrap;white-space:nowrap}
    .history-btn{
      border:1px solid var(--line);
      background:#f1f2f4;
      border-radius:999px;
      padding:5px 8px;
      color:#4f5660;
      font-size:11px;
      line-height:1.2;
      font-weight:750;
      box-shadow:none;
      transition:.15s;
    }
    .icon-btn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:9px 11px;
      color:var(--primary);
      font-size:13px;
      line-height:1.2;
      font-weight:700;
      box-shadow:var(--shadow-soft);
      transition:.15s;
      white-space:nowrap;
    }

    .dashboard{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0 12px}
    .dashboard-card{border:1px solid var(--line);background:rgba(255,255,255,.95);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow);min-height:102px;transition:.15s}
    .dashboard-label{font-size:12px;font-weight:750;color:var(--muted);margin-bottom:7px}
    .dashboard-value{font-size:25px;line-height:1;font-weight:850;letter-spacing:-.5px;color:var(--text)}
    .dashboard-sub{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.35}
    .dashboard-card.alert .dashboard-value{color:var(--danger)}
    .dashboard-card.alert{border-color:#f0c7ca;background:linear-gradient(180deg,#fff 0,var(--danger-soft) 100%)}
    .dashboard-card.done .dashboard-value{color:var(--success)}
    .dashboard-card.done{border-color:#cce8d7;background:linear-gradient(180deg,#fff 0,var(--success-soft) 100%)}
    .dashboard-arrow{float:right;font-size:12px;color:var(--muted);font-weight:700}

    .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
    .actions .primary{grid-column:1 / -1}
    .btn{border:0;border-radius:13px;padding:12px 10px;font-weight:750;background:#fff;box-shadow:var(--shadow-soft);transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
    .btn.primary{background:var(--primary);color:#fff;box-shadow:0 7px 16px rgba(47,111,228,.20)}
    .btn.danger{background:var(--danger);color:#fff}
    .btn.secondary{border:1px solid var(--line);color:#3f4650}
    .btn.delete-text{border:1px solid var(--line);color:var(--danger);background:#fff}
    .btn:active,.icon-btn:active,.history-btn:active,.dashboard-card:active{transform:scale(.985)}
    .search-wrap{position:relative;margin-bottom:12px}.search{width:100%;padding:12px 42px 12px 38px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none;box-shadow:var(--shadow-soft);margin:0}.search:focus{border-color:#b8c8ee;box-shadow:0 0 0 3px rgba(47,111,228,.08)}.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.55}.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:#eef0f3;border-radius:50%;width:28px;height:28px;color:#666;display:none}
    .warning-overview{width:100%;border:1px solid #f0c7ca;background:#fff;border-radius:13px;padding:12px 14px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
    .warning-overview .warning-main{font-weight:800;color:#b4232c}
    .warning-overview .warning-date{font-size:11px;color:var(--muted);margin-top:2px}
    .warning-overview .warning-action{font-size:12px;color:#b4232c;white-space:nowrap}
    .warning-overview.zero{border-color:var(--line)}
    .warning-overview.zero .warning-main,.warning-overview.zero .warning-action{color:#666}
    .warning-overview.active{background:#fff4f4;border-color:#dc8086}
    .category{background:var(--card);border:1px solid rgba(231,233,238,.85);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin:13px 0}
    .category-title{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-size:16px;font-weight:850;background:linear-gradient(180deg,#fff,#fafbfc);border-bottom:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;table-layout:fixed}
    th,td{border-bottom:1px solid var(--line);padding:11px 4px;text-align:center;font-size:13px;vertical-align:middle}
    th{background:#fafafa;font-weight:700;color:#555}
    th:first-child,td:first-child{width:43%;text-align:left;padding-left:12px;padding-right:6px}
    th:not(:first-child),td:not(:first-child){width:19%}
    tr:last-child td{border-bottom:none}
    .cell-btn{width:100%;border:0;background:transparent;padding:6px 1px;border-radius:8px;color:#555;font-size:13px;line-height:1.15}
    .cell-btn.has:active{background:var(--soft)}
    .empty{color:#aaa}
    .item-name{font-weight:650;line-height:1.25;overflow-wrap:anywhere}
    .item-name-btn{border:0;background:transparent;padding:4px 0;text-align:left;font-weight:700;color:inherit;width:100%;overflow-wrap:anywhere}
    .note{display:block;font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .latest-head{font-size:15px!important;font-weight:850!important;color:#1d315e!important;background:var(--primary-soft)!important}
    .latest-cell{background:#f9fbff}
    .latest-cell .cell-btn{font-size:16px;font-weight:800;color:#222}
    .latest-cell .cell-btn.low-stock{color:var(--danger);font-weight:850}
    .low-tag{display:block;width:max-content;margin:3px auto 0;padding:2px 5px;border-radius:999px;background:var(--danger-soft);color:var(--danger);font-size:8px;font-weight:800;line-height:1.1}
    .latest-cell .note{font-size:9px;font-weight:500}

    .empty-state{padding:28px 16px;text-align:center;color:var(--muted);background:#fff;border-radius:16px}
    .loading{padding:28px;text-align:center;color:var(--muted)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:50}
    .modal-backdrop.show{display:flex}
    .modal{background:#fff;width:min(760px,100%);border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 36px rgba(0,0,0,.12);animation:sheetUp .18s ease-out}@keyframes sheetUp{from{transform:translateY(18px);opacity:.65}to{transform:translateY(0);opacity:1}}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .modal h2{font-size:20px;margin:0}
    .close{border:0;background:#f1f1f1;border-radius:50%;width:34px;height:34px}
    label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
    input,select,textarea{width:100%;border:1px solid #d9dce1;border-radius:12px;padding:12px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#b8c8ee;box-shadow:0 0 0 3px rgba(47,111,228,.07)}
    textarea{resize:vertical;min-height:72px}
    .modal-actions{display:flex;gap:9px;margin-top:18px}
    .modal-actions .btn{flex:1}
    .count-list{display:flex;flex-direction:column;gap:10px}
    .count-row{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px;align-items:center;padding:11px;background:#f8f9fb;border:1px solid #eef0f3;border-radius:13px}
    .count-row input{padding:10px;text-align:center}
    .count-cat{font-size:12px;color:var(--muted)}
    .already{font-size:12px;color:var(--muted)}
    .date-box{background:#f8f9fb;border-radius:14px;padding:12px;margin-bottom:12px}
    .date-box label{margin-top:0}
    .count-control{display:flex;flex-direction:column;gap:6px}
    .copy-item-btn{width:100%;border:1px solid #d9e2f7;background:#f7faff;border-radius:9px;padding:6px 4px;color:var(--primary);font-size:10px;font-weight:800;line-height:1.2}
    .copy-item-btn:active{transform:scale(.985)}
    .progress-box{position:sticky;top:-1px;z-index:3;background:rgba(248,249,251,.96);backdrop-filter:blur(8px);border:1px solid #eceef2;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 5px 14px rgba(17,24,39,.045)}
    .progress-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .progress-title{font-size:14px;font-weight:800}
    .progress-count{font-size:14px;font-weight:800;color:var(--primary)}
    .progress-track{height:7px;background:#e7e9ed;border-radius:999px;overflow:hidden;margin-top:9px}
    .progress-fill{height:100%;width:0;background:var(--primary);border-radius:999px;transition:width .15s ease}
    .progress-box.complete .progress-count{color:#18864b}
    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#202124;color:#fff;padding:11px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90%;text-align:center}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px}
    .section-label{font-size:12px;font-weight:800;color:#666;margin:16px 0 7px}

    .sort-preview-note{font-size:12px;color:var(--muted);background:#f8f9fb;border-radius:12px;padding:10px 12px;line-height:1.5;margin-bottom:12px}
    .sort-block{margin-top:16px}
    .sort-block-title{font-size:14px;font-weight:800;margin-bottom:8px}
    .sort-row{display:grid;grid-template-columns:minmax(0,1fr) 42px 42px;gap:7px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:7px}
    .sort-row-name{font-weight:650;overflow-wrap:anywhere}
    .sort-arrow{border:1px solid var(--line);background:#f8f9fb;border-radius:9px;height:36px;font-weight:800}
    .sort-arrow:disabled{opacity:.35}

    @media (max-width:520px){
      .actions{grid-template-columns:1fr 1fr 1fr}
      .actions .primary{grid-column:1 / -1}
      h1{font-size:22px}
      th,td{font-size:12px}
      th:first-child,td:first-child{width:40%}
      th:not(:first-child),td:not(:first-child){width:20%}
    }
  
    .date-status{display:block;font-size:9px;line-height:1.15;margin-top:3px;font-weight:850}
    .date-status.pending{color:var(--danger)}
    .date-status.done{color:var(--success)}
    .menu-grid{display:grid;grid-template-columns:1fr;gap:9px}
    .menu-choice{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;text-align:left;font-weight:800;color:#333;box-shadow:var(--shadow-soft)}
    .menu-choice small{display:block;margin-top:3px;font-size:11px;color:var(--muted);font-weight:500}
    .movement-type-in{color:var(--success)}
    .movement-type-out{color:var(--danger)}
    .theory-btn{width:100%;border:1px solid #d7e2fb;background:#f7faff;border-radius:9px;padding:6px 4px;color:var(--primary);font-size:12px;font-weight:850;line-height:1.2}
    .theory-btn:disabled{opacity:.38;color:#777;background:#f4f4f4;border-color:#e5e5e5}

  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div>
        <h1>庫存清點紀錄</h1>
        <div class="sub" id="lastUpdated">載入中…</div>
      </div>
      <button class="icon-btn" id="refreshBtn">重新整理</button>
    </div>

    <div class="actions">
      <button class="btn primary" id="dailyBtn">每日清點</button>
      <button class="btn secondary" id="manageBtn">新增</button>
      <button class="btn secondary" id="movementBtn">出/入庫</button>
      <button class="btn secondary" id="recordsBtn">歷史紀錄</button>
    </div>

    <div class="dashboard">
      <button class="dashboard-card" id="lowStockCard" type="button">
        <span class="dashboard-arrow" id="lowStockArrow">查看 ›</span>
        <div class="dashboard-label">低庫存預警</div>
        <div class="dashboard-value" id="lowStockValue">0 項</div>
        <div class="dashboard-sub" id="lowStockSub">依最新一次清點判斷</div>
      </button>
    </div>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search" id="searchInput" placeholder="搜尋品項" autocomplete="off" />
      <button class="search-clear" id="searchClearBtn" type="button">×</button>
    </div>
    <div id="content" class="loading">正在讀取庫存資料…</div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://jtbmeajtjrxxqhtubtnq.supabase.co";
const SUPABASE_KEY = "sb_publishable_v0eeDGfyBeiO8khjE3jdUQ_HnfPY7Hd";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let categories = [];
let items = [];
let records = [];
let dateKeys = [];
let dateLabels = [];
let lowStockOnly = false;
let stockMovements = [];
let previousActualDates = [];
let todayComplete = false;
let currentQuantityMap = new Map();
let previewCategories = [];
let previewItems = [];

const $ = (id) => document.getElementById(id);

function localISODate(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function labelDate(iso) {
  if (!iso) return "—";
  const [y,m,d] = iso.split("-").map(Number);
  return `${m}/${d}`;
}
function getRecentDates() {
  const keys = [], labels = [];
  for (let i = 2; i >= 0; i--) {
    const d = new Date();
    d.setHours(12,0,0,0);
    d.setDate(d.getDate() - i);
    keys.push(localISODate(d));
    labels.push(`${d.getMonth()+1}/${d.getDate()}`);
  }
  return { keys, labels };
}

async function fetchAllRows(builderFactory, pageSize = 1000) {
  let from = 0;
  const all = [];
  while (true) {
    const { data, error } = await builderFactory().range(from, from + pageSize - 1);
    if (error) throw error;
    const rows = data || [];
    all.push(...rows);
    if (rows.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

function endOfSelectedDateISO(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d, 23, 59, 59, 999).toISOString();
}

function quantityFromBaseAndMovements(itemId, baseRecord, cutoffISO = new Date().toISOString()) {
  if (!baseRecord || baseRecord.quantity === null || baseRecord.quantity === undefined) return null;
  const baseTime = new Date(baseRecord.created_at).getTime();
  const cutoff = new Date(cutoffISO).getTime();
  let qty = Number(baseRecord.quantity);

  for (const mv of stockMovements) {
    if (Number(mv.item_id) !== Number(itemId)) continue;
    const t = new Date(mv.occurred_at).getTime();
    if (!(t > baseTime && t <= cutoff)) continue;
    qty += mv.movement_type === "in" ? Number(mv.quantity) : -Number(mv.quantity);
  }
  return qty;
}

function getLatestActualBefore(itemId, dateStr) {
  return records
    .filter(r => Number(r.item_id) === Number(itemId) && r.record_date < dateStr)
    .sort((a,b) => {
      const d = b.record_date.localeCompare(a.record_date);
      if (d !== 0) return d;
      return new Date(b.created_at) - new Date(a.created_at);
    })[0] || null;
}

function getTodayRecord(itemId) {
  const today = localISODate();
  return records.find(r => Number(r.item_id) === Number(itemId) && r.record_date === today) || null;
}

function esc(v="") {
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}
function showModal(html) {
  $("modal").innerHTML = html;
  $("modalBackdrop").classList.add("show");
}
function closeModal() {
  $("modalBackdrop").classList.remove("show");
}
$("modalBackdrop").addEventListener("click", e => {
  if (e.target === $("modalBackdrop")) closeModal();
});

async function loadAll(showLoading = true) {
  if (showLoading) $("content").innerHTML = '<div class="loading">正在讀取庫存資料…</div>';

  try {
    const [catRes, itemRes] = await Promise.all([
      sb.from("categories").select("id,name,sort_order,created_at")
        .order("sort_order",{ascending:true}).order("id",{ascending:true}),
      sb.from("items").select("id,name,category_id,warning_threshold,sort_order,created_at")
        .order("sort_order",{ascending:true}).order("id",{ascending:true})
    ]);

    const firstError = catRes.error || itemRes.error;
    if (firstError) throw firstError;

    categories = catRes.data || [];
    items = itemRes.data || [];

    records = await fetchAllRows(() =>
      sb.from("inventory_records")
        .select("id,item_id,record_date,quantity,note,created_at")
        .order("record_date",{ascending:false})
        .order("created_at",{ascending:false})
    );

    stockMovements = await fetchAllRows(() =>
      sb.from("stock_movements")
        .select("id,item_id,category_id,movement_type,quantity,occurred_at,operator_name,note,created_at")
        .order("occurred_at",{ascending:false})
    );

    const today = localISODate();

    previousActualDates = [...new Set(
      records.filter(r => r.record_date < today).map(r => r.record_date)
    )].sort((a,b) => b.localeCompare(a)).slice(0,2).reverse();

    const todayRows = records.filter(r => r.record_date === today);
    const todayItemIds = new Set(todayRows.map(r => Number(r.item_id)));
    todayComplete = items.length > 0 && items.every(item => todayItemIds.has(Number(item.id)));

    dateKeys = [...previousActualDates, today];
    dateLabels = dateKeys.map(labelDate);

    currentQuantityMap = new Map();
    for (const item of items) {
      const baseRecord = todayComplete
        ? getTodayRecord(item.id)
        : getLatestActualBefore(item.id, today);

      currentQuantityMap.set(
        Number(item.id),
        quantityFromBaseAndMovements(item.id, baseRecord, new Date().toISOString())
      );
    }

    render();
    $("lastUpdated").textContent =
      `即時庫存 · 更新 ${new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}`;

  } catch (error) {
    $("content").innerHTML = `<div class="empty-state">讀取失敗：${esc(error.message)}</div>`;
  }
}
function getLatestLowStockItemIds() {
  const ids = new Set();
  for (const item of items) {
    const qty = currentQuantityMap.get(Number(item.id));
    if (
      qty !== null && qty !== undefined &&
      item.warning_threshold !== null && item.warning_threshold !== undefined &&
      Number(qty) < Number(item.warning_threshold)
    ) {
      ids.add(Number(item.id));
    }
  }
  return ids;
}
function updateDashboard() {
  const today = localISODate();
  const lowIds = getLatestLowStockItemIds();
  const lowCard = $("lowStockCard");

  $("lowStockValue").textContent = `${lowIds.size} 項`;
  $("lowStockSub").textContent = todayComplete
    ? `${labelDate(today)} 已清點後的即時庫存`
    : `${labelDate(today)} 未清點的理論庫存`;
  $("lowStockArrow").textContent = lowStockOnly ? "顯示全部 ›" : "查看 ›";
  lowCard.classList.toggle("alert", lowIds.size > 0);
}
function render() {
  const q = $("searchInput").value.trim().toLowerCase();
  const lowIds = getLatestLowStockItemIds();
  const today = localISODate();

  let matchedItems = items.filter(i => i.name.toLowerCase().includes(q));
  if (lowStockOnly) matchedItems = matchedItems.filter(i => lowIds.has(Number(i.id)));

  updateDashboard();

  if (!categories.length) {
    $("content").innerHTML = '<div class="empty-state">尚未建立類別。</div>';
    return;
  }

  const recMap = new Map(records.map(r => [`${r.item_id}|${r.record_date}`, r]));
  let html = "";

  for (const c of categories) {
    const catItems = matchedItems.filter(i => i.category_id === c.id);
    if (!catItems.length && (q || lowStockOnly)) continue;

    html += `<section class="category">
      <div class="category-title"><span>${esc(c.name)}</span><span class="sub">${catItems.length} 項</span></div>`;

    if (!catItems.length) {
      html += `<div class="empty-state">這個類別目前沒有品項</div></section>`;
      continue;
    }

    const headers = previousActualDates.map(d => `<th>${labelDate(d)}</th>`).join("");
    const todayStatus = todayComplete
      ? `<span class="date-status done">（已清點）</span>`
      : `<span class="date-status pending">（未清點）</span>`;

    html += `<table>
      <thead><tr>
        <th>品項</th>
        ${headers}
        <th class="latest-head">${labelDate(today)}${todayStatus}</th>
      </tr></thead><tbody>`;

    for (const item of catItems) {
      html += `<tr><td><button class="item-name-btn" onclick="openEditItem(${item.id})">${esc(item.name)}</button></td>`;

      for (const d of previousActualDates) {
        const r = recMap.get(`${item.id}|${d}`);
        if (r) {
          const qty = r.quantity === null ? "—" : esc(r.quantity);
          const note = r.note ? `<span class="note">${esc(r.note)}</span>` : "";
          html += `<td><button class="cell-btn has" onclick="openEditRecord(${r.id})">${qty}${note}</button></td>`;
        } else {
          html += `<td><span class="empty">—</span></td>`;
        }
      }

      const currentQty = currentQuantityMap.get(Number(item.id));
      const isLowStock = lowIds.has(Number(item.id));
      const qtyText = currentQty === null || currentQty === undefined ? "—" : esc(currentQty);

      let clickAction = "";
      if (todayComplete) {
        const todayRecord = getTodayRecord(item.id);
        if (todayRecord) clickAction = `onclick="openEditRecord(${todayRecord.id})"`;
      }

      html += `<td class="latest-cell">
        <button class="cell-btn has ${isLowStock ? "low-stock" : ""}" ${clickAction}>
          ${qtyText}
          ${isLowStock ? '<span class="low-tag">低庫存</span>' : ''}
        </button>
      </td>`;

      html += `</tr>`;
    }

    html += `</tbody></table></section>`;
  }

  $("content").innerHTML = html || (
    lowStockOnly
      ? '<div class="empty-state">目前沒有符合條件的預警品項。</div>'
      : '<div class="empty-state">找不到符合的品項。</div>'
  );
}

async function loadDailyRows() {
  const dateInput = $("countDate");
  const holder = $("dailyRows");
  if (!dateInput || !holder) return;

  const selectedDate = dateInput.value;
  holder.innerHTML = '<div class="loading">正在讀取該日紀錄…</div>';

  const existingRows = records.filter(r => r.record_date === selectedDate);
  const existingMap = new Map(existingRows.map(r => [Number(r.item_id), r]));

  const cutoffISO = selectedDate === localISODate()
    ? new Date().toISOString()
    : endOfSelectedDateISO(selectedDate);

  const theoryMap = new Map();

  for (const item of items) {
    const base = getLatestActualBefore(item.id, selectedDate);
    theoryMap.set(
      Number(item.id),
      quantityFromBaseAndMovements(item.id, base, cutoffISO)
    );
  }

  let rows = "";

  for (const c of categories) {
    const catItems = items.filter(i => i.category_id === c.id);
    if (!catItems.length) continue;

    rows += `<div class="section-label">${esc(c.name)}</div>`;

    for (const i of catItems) {
      const existing = existingMap.get(Number(i.id));
      const theoryQty = theoryMap.get(Number(i.id));
      const hasTheory = theoryQty !== null && theoryQty !== undefined;

      rows += `<div class="count-row">
        <div>
          <div class="item-name">${esc(i.name)}</div>
          ${existing ? `<div class="already">此日已清點：${existing.quantity ?? "—"}${existing.note ? "｜"+esc(existing.note) : ""}</div>` : ""}
        </div>

        ${existing
          ? `<div class="count-control"><input value="${existing.quantity ?? ""}" disabled></div>`
          : `<div class="count-control">
               <button class="theory-btn" type="button"
                 ${hasTheory ? `onclick="fillTheoryQuantity(${i.id}, ${Number(theoryQty)})"` : "disabled"}
                 title="帶入理論數量">${hasTheory ? esc(theoryQty) : "—"}</button>
               <input id="daily-qty-${i.id}" class="daily-qty" data-item-id="${i.id}"
                 inputmode="numeric" type="number" min="0" step="1" placeholder="數量">
             </div>`}
      </div>`;
    }
  }

  holder.className = "count-list";
  holder.dataset.existingCount = String(existingMap.size);
  holder.innerHTML = rows || '<div class="empty-state">目前沒有品項</div>';

  document.querySelectorAll(".daily-qty").forEach(input => {
    input.addEventListener("input", updateDailyProgress);
  });

  updateDailyProgress();
}

function fillTheoryQuantity(itemId, quantity) {
  const input = $(`daily-qty-${itemId}`);
  if (!input) return;
  input.value = quantity;
  updateDailyProgress();
}
function updateDailyProgress() {
  const holder = $("dailyRows");
  const countEl = $("dailyProgressCount");
  const fillEl = $("dailyProgressFill");
  const boxEl = $("dailyProgressBox");

  if (!holder || !countEl || !fillEl || !boxEl) return;

  const existingCount = Number(holder.dataset.existingCount || 0);
  const newlyFilled = [...document.querySelectorAll(".daily-qty")]
    .filter(input => input.value !== "").length;

  const total = items.length;
  const completed = Math.min(existingCount + newlyFilled, total);
  const percent = total ? Math.round((completed / total) * 100) : 0;

  countEl.textContent = `已填 ${completed} / ${total} 項`;
  fillEl.style.width = `${percent}%`;
  boxEl.classList.toggle("complete", total > 0 && completed === total);
}



async function submitDaily() {
  const selectedDate = $("countDate").value;
  if (!selectedDate) return toast("請選擇清點日期");

  const inputs = [...document.querySelectorAll(".daily-qty")];
  const note = $("dailyNote").value.trim() || null;
  const payload = [];

  for (const input of inputs) {
    if (input.value === "") continue;
    const qty = Number(input.value);
    if (!Number.isInteger(qty) || qty < 0) return toast("數量只能輸入 0 以上整數");

    payload.push({
      item_id: Number(input.dataset.itemId),
      record_date: selectedDate,
      quantity: qty,
      note
    });
  }

  const editableInputs = [...document.querySelectorAll(".daily-qty")];
  const unfilled = editableInputs.filter(input => input.value === "");

  if (unfilled.length > 0) {
    return toast(`尚有 ${unfilled.length} 個品項未填寫`);
  }

  if (!payload.length) return toast("這一天沒有需要新增的清點資料");

  const { error } = await sb.from("inventory_records").insert(payload);
  if (error) {
    if (String(error.message).toLowerCase().includes("duplicate")) {
      return toast("有品項在這一天已經清點過，請重新整理後再試");
    }
    return toast("清點送出失敗：" + error.message);
  }

  closeModal();
  toast(`已送出 ${payload.length} 個品項`);
  await loadAll(false);
}

function renderSortPreview(selectedCategoryId = null) {
  if (!previewCategories.length) return toast("目前沒有類別");

  const selectedId = selectedCategoryId ?? previewCategories[0].id;

  const categoryRows = previewCategories.map((c, index) => `

      <button class="sort-arrow" ${index === 0 ? "disabled" : ""} onclick="movePreviewCategory(${c.id}, -1)">↑</button>
      <button class="sort-arrow" ${index === previewCategories.length - 1 ? "disabled" : ""} onclick="movePreviewCategory(${c.id}, 1)">↓</button>
    </div>
  `).join("");

  const catOptions = previewCategories.map(c =>
    `<option value="${c.id}" ${c.id === selectedId ? "selected" : ""}>${esc(c.name)}</option>`
  ).join("");

  const catItems = previewItems.filter(i => i.category_id === selectedId);

          <button class="sort-arrow" ${index === 0 ? "disabled" : ""} onclick="movePreviewItem(${item.id}, -1, ${selectedId})">↑</button>
          <button class="sort-arrow" ${index === catItems.length - 1 ? "disabled" : ""} onclick="movePreviewItem(${item.id}, 1, ${selectedId})">↓</button>

    : '<div class="empty-state">這個類別目前沒有品項</div>';

  showModal(`${modalHeader("排序")}
    <div class="sort-preview-note">

function movePreviewCategory(categoryId, direction) {
  const index = previewCategories.findIndex(c => c.id === categoryId);
  const target = index + direction;
  if (index < 0 || target < 0 || target >= previewCategories.length) return;

  [previewCategories[index], previewCategories[target]] =
    [previewCategories[target], previewCategories[index]];

  renderSortPreview(categoryId);
}

function movePreviewItem(itemId, direction, categoryId) {
  const catItems = previewItems.filter(i => i.category_id === categoryId);
  const index = catItems.findIndex(i => i.id === itemId);
  const target = index + direction;
  if (index < 0 || target < 0 || target >= catItems.length) return;

  const firstGlobal = previewItems.findIndex(i => i.id === catItems[index].id);
  const secondGlobal = previewItems.findIndex(i => i.id === catItems[target].id);

  [previewItems[firstGlobal], previewItems[secondGlobal]] =
    [previewItems[secondGlobal], previewItems[firstGlobal]];

  renderSortPreview(categoryId);
}

  if (!data?.success) return toast(data?.message || "刪除失敗");

  closeModal();
  toast("品項已刪除");
  await loadAll(false);
}

function openEditRecord(recordId) {
  const r = records.find(x => x.id === recordId);
  if (!r) return;
  const item = items.find(i => i.id === r.item_id);
  showModal(`${modalHeader("修改清點紀錄")}
    <div class="sub">${esc(item?.name || "")}｜${esc(r.record_date)}</div>
    <label>數量</label>
    <input id="editQuantity" type="number" inputmode="numeric" min="0" step="1" value="${r.quantity ?? ""}" placeholder="可留空">
    <label>備註</label>
    <textarea id="editNote" placeholder="選填">${esc(r.note || "")}</textarea>
    <label>管理密碼</label>
    <input id="adminPassword" type="password" placeholder="請輸入管理密碼">
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="submitEditRecord(${r.id})">儲存修改</button>
    </div>`);
}

async function submitEditRecord(recordId) {
  const quantity = $("editQuantity").value;
  const note = $("editNote").value;
  const password = $("adminPassword").value;
  if (!password) return toast("請輸入管理密碼");

  const { data, error } = await sb.functions.invoke("admin-update-record", {
    body: { password, recordId, quantity, note }
  });
  if (error) return toast("修改失敗：" + error.message);
  if (!data?.success) return toast(data?.message || "修改失敗");
  closeModal(); toast("紀錄修改成功"); await loadAll(false);
}

$("refreshBtn").addEventListener("click", () => loadAll());
$("lowStockCard").addEventListener("click", () => {
  lowStockOnly = !lowStockOnly;
  render();
});
$("searchInput").addEventListener("input", () => {
  $("searchClearBtn").style.display = $("searchInput").value ? "block" : "none";
  render();
});
$("searchClearBtn").addEventListener("click", () => {
  $("searchInput").value = "";
  $("searchClearBtn").style.display = "none";
  render();
});
$("manageBtn").addEventListener("click", openManageMenu);
$("movementBtn").addEventListener("click", openMovementMenu);
$("recordsBtn").addEventListener("click", openRecordsMenu);
$("dailyBtn").addEventListener("click", openDailyCount);

loadAll();
setInterval(() => loadAll(false), 30000);
</script>
</body>
</html>
